    <script>
      // Target reference solutions with normalized spaces
      const solutions = {
        1: "WALANG MAKABULUHANG ARGUMENTO ANG MGA ANTI-FILIPINO–ANG KAMPONG TANGGAL WIKA–SA PAGPAPATANGGAL NG FILIPINO AT PANITIKAN",
        2: "DAPAT MAY FILIPINO AT PANITIKAN SA KOLEHIYO DAHIL ANG IBANG ASIGNATURA NA NASA JUNIOR AT/O SENIOR HIGHSCHOOL AY MAY KATUMBAS PA RIN SA KOLEHIYO",
        3: "ANG FILIPINO AY DISIPLINA, ASIGNATURA, BUKOD NALARANGAN NG PAG-AARAL, AT HINDI SIMPLENG WIKANG PANTURO LAMANG",
        4: "PARA MAGING EPEKTIBONG WIKANG PANTURO ANG FILIPINO, KAILANGANG ITURO AT LINANGIN DIN ITO BILANG ASIGNATURA",
        5: "BAHAGI NG COLLEGE READINESS STANDARDS ANG FILIPINO AT PANITIKAN",
        6: "SA IBANG BANSA, MAY ESPASYO RIN SA KURIKULUM ANG SARILING WIKA BILANG ASIGNATURA, BUKOD PA SA PAGIGING WIKANG PANTURO NITO",
        7: "BINIGYAN NG DEPED AT CHED NG ESPASYO ANG MGA WIKANG DAYUHAN SA KURIKULUM, KAYA LALONG DAPAT NA MAY ESPASYO PARA SA WIKANG PAMBANSA",
        8: "PINAG-AARALAN DIN SA IBANG BANSA ANG FILIPINO – AT MAY POTENSYAL ITONG MAGING ISANG NANGUNGUNANG WIKANG GLOBAL – KAYA LALONG DAPAT ITONG PAG-ARALAN SA PILIPINAS",
        9: "MALAPIT ANG FILIPINO SA BAHASA MELAYU, BAHASA INDONESIA, AT BRUNEI MALAY, MGA WIKANG GINAGAMIT SA MALAYSIA, SINGAPORE, INDONESIA, AT BRUNEI, NA MGA BANSANG KASAPI NG ASEAN, KAYA’T MAHALAGANG WIKA ITO SA KONTEKSTO MISMO NG ASEAN INTEGRATION",
        10: "MABABA PA RIN ANG AVERAGE SCORE NG MGA ESTUDYANTE SA FILIPINO SA NATIONAL ACHIEVEMENT TEST (NAT)",
        11: "FILIPINO ANG WIKA NG MAYORYA, NG MIDYA, AT NG MGA KILUSANG PANLIPUNAN: ANG WIKA SA DEMOKRATIKO AT MAPAGPALAYANG DOMEYN NA MAHALAGA SA PAGBABAGONG PANLIPUNAN",
        12: "MULTILINGGWALISMO ANG KASANAYANG AKMA SA SIGLO 21",
        13: "HINDI PINAUNLAD, HINDI NAPAUNLAD AT HINDI MAPAPAUNLAD NG PAGSANDIG SA WIKANG DAYUHAN ANG EKONOMYA NG BANSA",
        14: "MAY SAPAT NA MATERYAL AT NILALAMAN NA MAITUTURO SA FILIPINO AT PANITIKAN SA KOLEHIYO"
      };

      // Helper function to normalize spaces for comparison
      function cleanText(text) {
        return text.trim().replace(/\s+/g, ' ').toLowerCase();
      }

      // Check single field by index
      function validateSingle(index) {
        const userInput = document.getElementById(`argument_${index}`).value;
        const cleanedInput = cleanText(userInput);
        const cleanedTarget = cleanText(solutions[index]);

        if (cleanedInput === cleanedTarget) {
          alert(`nice`);
          return true;
        } else {
          alert(`"${solutions[index]}"`);
          return false;
        }
      }

      // Check all fields on full form submit
      function validateForm() {
        let allCorrect = true;

        for (let i = 1; i <= 14; i++) {
          const userInput = document.getElementById(`argument_${i}`).value;
          if (cleanText(userInput) !== cleanText(solutions[i])) {
            alert(`may mali ka ata lmao`);
            allCorrect = false;
            break;
          }
        }

        if (allCorrect) {
          alert("nice one sheesh");
        }
      }
    </script>
